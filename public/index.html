<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: '宋体', SimSun, serif;
  background: linear-gradient(135deg, #e8f0fe 0%, #f0f4f8 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.card {
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(45,106,159,0.12);
  width: 100%;
  max-width: 500px;
  padding: 36px 30px 30px;
  position: relative;
  min-height: 400px;
}
.top-bar { display: flex; align-items: center; margin-bottom: 24px; gap: 12px; }
.back-btn {
  background: none; border: none; color: #bbb; font-size: 20px;
  cursor: pointer; padding: 2px 8px; border-radius: 6px;
  transition: all 0.15s; font-family: inherit; flex-shrink: 0;
}
.back-btn:hover { background: #f0f4f8; color: #555; }
.back-btn:disabled { opacity: 0; pointer-events: none; }
.progress-wrap { flex: 1; height: 5px; background: #e8edf2; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg,#2d6a9f,#5b9fd4); border-radius: 3px; transition: width 0.4s ease; }
.section-badge {
  display: inline-block; background: #eef4fb; color: #2d6a9f;
  font-size: 12px; padding: 3px 12px; border-radius: 20px;
  margin-bottom: 14px; font-weight: bold;
}
.q-text { font-size: 19px; font-weight: bold; color: #1a2b3c; line-height: 1.55; margin-bottom: 6px; }
.q-sub { font-size: 13px; color: #999; margin-bottom: 20px; line-height: 1.5; }
.options { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.option {
  border: 1.5px solid #e4eaf2; border-radius: 12px; padding: 13px 16px;
  cursor: pointer; transition: all 0.15s; font-size: 15px; color: #333;
  line-height: 1.4; user-select: none;
}
.option:hover { border-color: #2d6a9f; background: #f5f9ff; }
.option.selected { border-color: #2d6a9f; background: #eef4fb; color: #1a5080; }
.cb {
  width: 18px; height: 18px; border: 2px solid #ccc; border-radius: 4px;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.15s; vertical-align: middle; margin-right: 10px;
}
.option.selected .cb { background: #2d6a9f; border-color: #2d6a9f; }
.cb svg { display: none; }
.option.selected .cb svg { display: block; }
.opt-label { vertical-align: middle; }
.other-input {
  display: none; width: 100%; margin-top: 8px; border: none;
  border-bottom: 1.5px solid #2d6a9f; outline: none; font-size: 14px;
  padding: 4px 0; background: transparent; font-family: inherit; color: #333;
}
.option.selected .other-input { display: block; }
.text-input {
  width: 100%; border: none; border-bottom: 2px solid #e0e7ef; outline: none;
  font-size: 16px; padding: 10px 0; margin-top: 8px; font-family: inherit;
  color: #1a2b3c; background: transparent; transition: border-color 0.2s;
}
.text-input:focus { border-bottom-color: #2d6a9f; }
textarea.text-input {
  border: 1.5px solid #e0e7ef; border-radius: 10px; padding: 12px;
  resize: vertical; min-height: 110px; font-size: 15px; display: block;
}
textarea.text-input:focus { border-color: #2d6a9f; }
.btn-row { display: flex; gap: 10px; margin-top: 28px; }
.btn {
  flex: 1; padding: 13px; border-radius: 12px; border: none; font-size: 15px;
  cursor: pointer; font-family: inherit; font-weight: bold; transition: all 0.15s;
}
.btn-primary { background: #2d6a9f; color: #fff; }
.btn-primary:hover { background: #235a8a; transform: translateY(-1px); }
.btn-skip { background: #f0f4f8; color: #aaa; font-weight: normal; }
.btn-skip:hover { background: #e4eaf0; color: #888; }
.done-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0 20px; text-align: center; }
.done-icon {
  width: 72px; height: 72px; background: linear-gradient(135deg,#2d6a9f,#5b9fd4);
  border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;
}
.done-title { font-size: 22px; font-weight: bold; color: #1a2b3c; margin-bottom: 10px; }
.done-sub { font-size: 14px; color: #888; line-height: 1.7; }
.fade-in { animation: fadeUp 0.25s ease both; }
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>

// ── 状态 ──
let answers = {}, navHistory = [], submitted = false;
const TOTAL = 12;

// ── 工具函数 ──
function answerToStr(v) {
  if (!v && v !== 0) return '';
  if (typeof v === 'string') return v;
  if (Array.isArray(v)) return v.map(i => i.inputVal ? `${i.label}：${i.inputVal}` : i.label).join('；');
  if (v.label) return v.inputVal ? `${v.label}：${v.inputVal}` : v.label;
  return String(v);
}

// ── 渲染 ──
function show(id) {
  if (id === 'done') {
    if (!submitted) { submitted = true; doSubmit(); }
    renderDone(); return;
  }
  const q = Q[id]; if (!q) return;
  document.getElementById('pFill').style.width = Math.min(96, navHistory.length / TOTAL * 100) + '%';
  document.getElementById('backBtn').disabled = navHistory.length === 0;
  const prev = answers[id];
  let h = '<div class="fade-in">';
  if (q.section) h += `<div class="section-badge">${q.section}</div>`;
  h += `<div class="q-text">${q.text}</div>`;
  if (q.subtext) h += `<div class="q-sub">${q.subtext}</div>`;

  if (q.type === 'text' || q.type === 'textarea') {
    h += q.type === 'textarea'
      ? `<textarea class="text-input" id="tIn" placeholder="${q.placeholder||''}"></textarea>`
      : `<input type="text" class="text-input" id="tIn" placeholder="${q.placeholder||''}">`;
    h += '<div class="btn-row">';
    if (q.skippable) h += `<button class="btn btn-skip" onclick="handleText('${id}',true)">跳过</button>`;
    h += `<button class="btn btn-primary" onclick="handleText('${id}',false)">下一题 →</button></div>`;
  } else if (q.type === 'single') {
    const hasInput = q.options.some(o => o.input);
    h += '<div class="options" id="opts">';
    q.options.forEach((opt, i) => {
      const sel = prev && prev.label === opt.label ? ' selected' : '';
      h += `<div class="option${sel}" id="o${i}" onclick="pickSingle('${id}',${i})">`;
      h += `<span class="opt-label">${opt.label}</span>`;
      if (opt.input) {
        const v = (prev && prev.label === opt.label) ? (prev.inputVal||'') : '';
        h += `<input class="other-input" id="oi${i}" placeholder="请填写…" value="${v}" onclick="event.stopPropagation()">`;
      }
      h += '</div>';
    });
    h += '</div>';
    if (hasInput) h += `<div class="btn-row"><button class="btn btn-primary" onclick="confirmSingle('${id}')">下一题 →</button></div>`;
  } else if (q.type === 'multi') {
    h += '<div class="options" id="opts">';
    q.options.forEach((opt, i) => {
      const sel = prev && prev.some(p => p.label === opt.label) ? ' selected' : '';
      const iv = prev ? (prev.find(p => p.label === opt.label)||{}).inputVal||'' : '';
      h += `<div class="option${sel}" id="o${i}" onclick="toggleMulti(${i})">`;
      h += `<span class="cb"><svg viewBox="0 0 10 8" fill="none"><polyline points="1,4 4,7 9,1" stroke="white" stroke-width="2"/></svg></span>`;
      h += `<span class="opt-label">${opt.label}</span>`;
      if (opt.input) h += `<input class="other-input" id="oi${i}" placeholder="请填写…" value="${iv}" onclick="event.stopPropagation()">`;
      h += '</div>';
    });
    h += '</div>';
    h += `<div class="btn-row"><button class="btn btn-primary" onclick="confirmMulti('${id}')">下一题 →</button></div>`;
  }
  h += '</div>';
  document.getElementById('content').innerHTML = h;
  const tIn = document.getElementById('tIn');
  if (tIn) { if (prev) tIn.value = prev; setTimeout(() => tIn.focus(), 80); }
}

function pickSingle(qId, i) {
  const q = Q[qId], opt = q.options[i];
  if (opt.input || q.options.some(o => o.input)) {
    document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
    document.getElementById('o'+i).classList.add('selected');
    if (opt.input) setTimeout(() => document.getElementById('oi'+i)?.focus(), 50);
    return;
  }
  answers[qId] = {label: opt.label, inputVal: ''};
  navHistory.push(qId);
  show(opt.next || q.next);
}

function confirmSingle(qId) {
  const q = Q[qId];
  const sel = document.querySelector('.option.selected');
  if (!sel) return shake('opts');
  const i = parseInt(sel.id.replace('o',''));
  const opt = q.options[i];
  const inputVal = opt.input ? (document.getElementById('oi'+i)?.value?.trim()||'') : '';
  if (opt.input && !inputVal) { document.getElementById('oi'+i)?.focus(); return; }
  answers[qId] = {label: opt.label, inputVal};
  navHistory.push(qId);
  show(opt.next || q.next);
}

function toggleMulti(i) { document.getElementById('o'+i)?.classList.toggle('selected'); }

function confirmMulti(qId) {
  const q = Q[qId];
  const selected = [];
  q.options.forEach((opt, i) => {
    if (document.getElementById('o'+i)?.classList.contains('selected')) {
      selected.push({label: opt.label, inputVal: opt.input ? (document.getElementById('oi'+i)?.value?.trim()||'') : ''});
    }
  });
  if (!selected.length) return shake('opts');
  answers[qId] = selected;
  navHistory.push(qId);
  show(q.next);
}

function handleText(qId, skip) {
  const q = Q[qId];
  const val = document.getElementById('tIn')?.value?.trim() || '';
  if (!skip && q.required && !val) { shake('tIn'); return; }
  answers[qId] = skip ? '' : val;
  navHistory.push(qId);
  show(q.next);
}

function goBack() {
  if (!navHistory.length) return;
  show(navHistory.pop());
}

function shake(id) {
  const el = document.getElementById(id); if (!el) return;
  let n = 0;
  const t = setInterval(() => {
    el.style.transform = `translateX(${n%2===0?-5:5}px)`;
    if (++n > 5) { clearInterval(t); el.style.transform = ''; }
  }, 50);
}

function renderDone() {
  document.getElementById('pFill').style.width = '100%';
  document.getElementById('backBtn').disabled = true;
  document.getElementById('content').innerHTML = `
    <div class="done-wrap fade-in">
      <div class="done-icon">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <polyline points="6,18 14,26 30,10" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="done-title">提交成功！</div>
      <div class="done-sub">谢谢你认真填写<br>老师看到之后会联系你的</div>
    </div>`;
}

async function doSubmit() {
  const payload = {
    name: answers['start'] || '',
    class_name: answers['start_class'] || '',
    direction: answerToStr(answers['q1']),
    anxiety_level: answerToStr(answers['qend1']),
    wants_chat: answerToStr(answers['qend2']),
    contact: answers['qend2a'] || '',
    message: answers['qend3'] || '',
    full_answers: answers
  };
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/responses`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
  } catch(e) { console.error(e); }
}

show('start');
</script>
